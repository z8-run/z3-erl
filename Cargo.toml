[workspace]
members = ["kernel", "flow", "back", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
glob = "0.3"
toml = "0.8"
kernel = { path = "kernel" }
flow = { path = "flow" }
back = { path = "back" }
